# ---------------------------------------------------------------------------
# JobSonar search configuration.
#
# These are working defaults, not a personal setup — edit `queries` and
# `locations` to your own stack and city and the whole pipeline retargets.
# Everything here is safe to commit; personal details live in
# config/profile.yaml and credentials in .env.local (both git-ignored).
#
# Full reference: docs/CONFIGURATION.md
# ---------------------------------------------------------------------------

# Role titles to search for. Every query runs against every enabled source
# and every location, so keep the list focused — 24 queries x 1 location is
# already a few hundred HTTP requests per scan.
queries:
  - "MERN stack developer"
  - "Full stack developer React Node"
  - "Node.js developer"
  - "Python developer"
  - "Python Django developer"
  - "Python full stack developer"
  - "React developer"
  - "React JS developer"
  - "Frontend developer React"
  - "Backend developer Node.js"
  - "JavaScript developer"
  - "Software engineer fresher"
  - "Full stack developer fresher"
  - "MERN stack developer fresher"
  - "Associate software engineer"
  - "Associate frontend developer"
  - "Associate full stack engineer"
  - "Junior full stack developer"
  - "Junior React developer"
  - "Junior Node.js developer"
  - "Next.js developer"
  - "Software developer React Node"
  - "Web developer"
  - "Web developer fresher"

# Cities to search. Add "Remote" to also hit the keyless remote-job APIs.
locations:
  - "Chennai"

adzuna_country: in       # in, us, gb, etc.
max_results_per_query: 50
min_score: 35            # 0-100; jobs below this are stored but not shortlisted
posted_within_days: 3
api_workers: 12
web_workers: 8
watchlist_company_limit: 0   # 0 = all companies
watchlist_workers: 15         # parallel career-page fetches

# ---------------------------------------------------------------------------
# Direct ATS feeds — add company board tokens you care about.
#
# Every token below was probed live before being listed, and the trailing
# comment is the measured yield: total postings / how many are in Chennai.
# Boards with a strong India presence but zero Chennai postings are kept on
# purpose — India-wide hiring rotates through Chennai, and a board that is
# empty for your city this week is not a dead board. Boards that returned 0
# jobs on any platform were removed instead.
#
# The scoring filters (experience level, location, freshness) narrow what
# actually reaches your shortlist; these lists only widen what gets fetched.
# ---------------------------------------------------------------------------

# Greenhouse token = the slug in job-boards.greenhouse.io/<token>
greenhouse_boards:
  - mitsogoinc            #  35 total / 21 Chennai  <- best Chennai ratio measured
  - appian                # 198 total / 40 Chennai  <- best board in this list
  - tekion                #  75 total /  9 Chennai
  - devrev                #  42 total /  1 Chennai / 33 India
  - arcadiacareers        #  12 total /  4 Chennai
  - fourkites             #  11 total /  3 Chennai
  - phonepe               #  69 total /  0 Chennai / 49 India
  - zafinlabsamericasinc  #  26 total /  0 Chennai /  5 India
  - rubrik                # 107 total /  0 Chennai / 24 India
  - postman               # 108 total /  0 Chennai / 12 India
  - groww                 #  11 total /  0 Chennai / 11 India
  - druva                 #  27 total /  0 Chennai / 10 India
  - turing                #  27 total /  0 Chennai /  9 India
# Lever token = the slug in jobs.lever.co/<token>
lever_boards:
  - pditechnologies       #  19 total /  6 Chennai
  - brillio-2             #  99 total /  4 Chennai
  - paytm                 # 239 total /  3 Chennai / 193 India  <- largest India board found
  - nium                  #  37 total /  2 Chennai
  - dozee                 #  27 total /  1 Chennai
  - cprime                #  14 total /  1 Chennai
  - meesho                #  49 total /  0 Chennai / 45 India
  - hevodata              #  41 total /  0 Chennai / 39 India
  - zeta                  #  24 total /  0 Chennai / 23 India
  - mindtickle            #  21 total /  0 Chennai / 20 India
  - cred                  #   4 total /  0 Chennai /  4 India
# Ashby board/company names for jobs.ashbyhq.com/<name>
ashby_boards:
  - netgear               #  35 total /  9 Chennai
  - poshmark              #  28 total /  3 Chennai
  - atlan                 #   5 total /  0 Chennai /  5 India
# SmartRecruiters company IDs for api.smartrecruiters.com
smartrecruiters_companies:
  - Freshworks            # 100 total / 20 Chennai
# Rippling public board slugs
rippling_boards: []
# Recruitee / Personio / Breezy / Workable are all live and working fetchers,
# but they are European-centric: ~90 India-relevant slugs were probed across the
# four and every one returned zero open roles. They stay empty on purpose — the
# fetchers still earn their place through watchlist auto-detection, which is
# where a non-Indian company on one of these platforms gets picked up.
# Recruitee: the subdomain in <slug>.recruitee.com
recruitee_boards: []
# Personio: the subdomain in <slug>.jobs.personio.de
personio_boards: []
# Breezy HR: the subdomain in <slug>.breezy.hr (feed carries no description —
# the watchlist hydrator fills it in when the company is also on the watchlist)
breezy_boards: []
# Workable: the account slug in apply.workable.com/<slug>
workable_boards: []
# BambooHR: the subdomain in <slug>.bamboohr.com/careers.
# Field mapping is unverified — no probed board had open roles. See ats.py.
bamboohr_boards: []
# Workday needs three parts, written as "tenant/dc/site" — read them off a real
# board URL like <tenant>.<dc>.myworkdayjobs.com/<site>. Do not guess: the API
# answers 422 for an unknown tenant and 404 for a known tenant with the wrong
# site name, and site names are arbitrary per company.
workday_tenants:
  - uniphore/wd503/Uniphore    # Chennai HQ, detected off its own careers page
  - browserstack/wd3/External
  - citi/wd5/2                 # 2000 total / 12 India per 40 sampled
# Keka token = the subdomain in <token>.keka.com/careers. Keka is India-only and
# common among Chennai/Bangalore product startups.
keka_boards:
  - sisainfosec           #  20 total
  - disprz                #  18 total
  - surveysparrow         #   3 total
# Optional direct career pages for generic structured-data extraction
jsonld_urls: []
nextdata_urls: []

sources:
  # API — needs ADZUNA_APP_ID + ADZUNA_APP_KEY in .env
  adzuna: true
  jsearch: true
  greenhouse: true
  lever: true
  keka: true              # India-only ATS, verified against three live boards
  ashby: true             # Ashby public job board API
  smartrecruiters: true   # SmartRecruiters API (no auth, but needs company_id)
  rippling: false         # Rippling ATS API (no auth)
  recruitee: true         # Recruitee /api/offers/ feed
  personio: true          # Personio /xml feed
  breezy: true            # Breezy HR /json feed
  workable: true          # Workable embedded-widget account feed
  workday: true           # Workday CXS API (needs workday_tenants entries)
  bamboohr: false         # unverified field mapping — enable once you have a live board
  # Generic structured-data extraction from career pages
  jsonld: true            # JSON-LD JobPosting schema extraction
  nextdata: true          # Next.js __NEXT_DATA__ extraction
  # Scrapers — no keys; linkedin works, others often bot-blocked
  linkedin: true
  simplyhired: true
  timesjobs: true
  naukri: false
  # Free keyless remote-job APIs — only queried when location == "Remote"
  arbeitnow: true
  remotive: true
  remoteok: true
  jobicy: true
  # Company career-page watchlist — config/companies.yaml
  # Now extracts INDIVIDUAL job listings via ATS detection + API calls
  watchlist: true
  watchlist_extract_jobs: true  # extract individual jobs (vs. page-level alerts)

llm:
  scoring: true          # use an LLM to refine the keyword score for shortlisted jobs
  tailoring: true        # generate tailored resume bullets + cover letters
  provider: omniroute    # omniroute (local gateway, free)
  # OmniRoute (https://omniroute.online) — free, open-source multi-provider AI
  # router you self-host, exposes an OpenAI-compatible endpoint at
  # localhost:20128/v1 by default. Put OMNIROUTE_API_KEY (from its dashboard) in
  # .env if your instance requires one.
  omniroute_base_url: http://localhost:20128/v1
  omniroute_model: auto  # or a specific routed model / mode alias like /coding, /cheap

# LinkedIn feed-post scanning — pure Python (Playwright), no browser extension.
# Setup: run `python run.py linkedin-login` once, then set enabled: true.
# Reads only (never posts/comments) but keep queries/max_posts modest — see
# job_agent/sources/linkedin_feed.py for the bot-detection caveat.
# Naukri authenticated search — auto-launches YOUR Chrome via CDP.
# No manual login or browser setup needed — it launches Chrome with your
# default profile (where Naukri is already logged in), searches, and closes it.
# Set enabled: true, then run `python run.py search` or `python run.py naukri-search`.
naukri_auth:
  enabled: false
  cdp_port: 9222
  max_results: 20
  # Both default to the standard Chrome location for your OS and the current
  # user's profile directory. Uncomment only to point at a custom install.
  # chrome_path: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
  # user_data_dir: "C:\\Users\\<you>\\AppData\\Local\\Google\\Chrome\\User Data"
  # Change to "Profile 1", "Profile 2", etc., to use a specific Chrome profile
  profile_directory: "Default"

linkedin_feed:
  enabled: false
  state_path: data/linkedin_auth.json
  max_posts: 15
  queries:
    - "MERN stack hiring Chennai"
    - "React developer intern Chennai"
    - "Node.js fresher hiring Chennai"
